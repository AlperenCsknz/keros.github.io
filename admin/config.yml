backend:
  name: github
  repo: alperencsknz/keros.github.io
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "menu_yonetimi"
    label: "Menü Yönetimi"
    description: "Tüm menülerinizi buradan güncelleyebilirsiniz"
    files:
      - label: "Yemekleri Düzenle"
        name: "yemekler"
        file: "menu.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Ürünler"
            name: "items"
            widget: "list"
            fields:
              - {label: "Yemek Adı", name: "name", widget: "string"}
              - {label: "Görsel (İsteğe Bağlı)", name: "image", widget: "image", required: false}
              - {label: "Servis Fiyatı", name: "price_servis", widget: "string", required: false}
              - {label: "Ekmek Arası Fiyatı", name: "price_ekmek", widget: "string", required: false}
              - {label: "Tek Fiyat", name: "price_tek", widget: "string", required: false}

      - label: "Çorbaları Düzenle"
        name: "corbalar"
        file: "corbalar.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Ürünler"
            name: "items"
            widget: "list"
            fields:
              - {label: "Çorba Adı", name: "name", widget: "string"}
              - {label: "Fiyat", name: "price_tek", widget: "string"}

      - label: "İçecekleri Düzenle"
        name: "icecekler"
        file: "icecekler.json"
        extension: "json"
        format: "json"
        fields:
          - label: "Ürünler"
            name: "items"
            widget: "list"
            fields:
              - {label: "İçecek Adı", name: "name", widget: "string"}
              - {label: "Fiyat", name: "price_tek", widget: "string"}